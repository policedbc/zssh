[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zeaz-zssh"
version = "0.1.0"
description = "Local-first cross-platform OpenSSH bootstrap and client profile manager"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "ZEAZDEV" }]
keywords = ["ssh", "bootstrap", "openssh", "cross-platform", "security"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: System :: Systems Administration",
  "Topic :: Security",
]

[project.urls]
Repository = "https://github.com/policedbc/zssh"
Issues = "https://github.com/policedbc/zssh/issues"

[project.scripts]
zssh = "zssh:main"
zfleet = "zfleet:main"

[tool.setuptools]
py-modules = ["zssh", "zfleet"]
package-dir = { "" = "scripts" }
