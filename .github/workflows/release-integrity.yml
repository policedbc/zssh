name: Release integrity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build verified source and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz --strict
      - name: Generate SHA-256 provenance manifest
        run: |
          python - <<'PY'
          import glob
          import hashlib
          import json
          from pathlib import Path
          files = sorted(glob.glob("dist/*.whl") + glob.glob("dist/*.tar.gz"))
          if len(files) != 2: raise SystemExit(f"Expected two distributions, found {len(files)}")
          manifest = {Path(f).name:hashlib.sha256(Path(f).read_bytes()).hexdigest() for f in files}
          Path("dist/SHA256SUMS.json").write_text(json.dumps(manifest,sort_keys=True,indent=2)+"\n")
          PY
      - name: Upload reproducible evidence
        uses: actions/upload-artifact@v4
        with:
          name: package-integrity-evidence
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.json
          if-no-files-found: error
