name: Python package verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate package
        run: |
          python -m pip install --disable-pip-version-check build twine
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz --strict
          python -m pip install --force-reinstall --no-deps dist/*.whl
          zssh --help
      - name: Verify no SSH private keys are included
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile
          for wheel in glob.glob('dist/*.whl'):
              with zipfile.ZipFile(wheel) as archive:
                  names = archive.namelist()
                  assert 'zssh.py' in names, names
                  assert not any(name.endswith(('id_rsa', 'id_ed25519', '.pem')) for name in names)
          for sdist in glob.glob('dist/*.tar.gz'):
              with tarfile.open(sdist, 'r:gz') as archive:
                  assert not any(name.endswith(('id_rsa', 'id_ed25519', '.pem')) for name in archive.getnames())
          PY
